services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: staff_engineer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d staff_engineer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vse_postgres_data:

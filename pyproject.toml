[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-staff-engineer"
version = "0.1.0"
description = "A human-supervised agent for evidence-backed code governance."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "google-genai",
    "psycopg[binary]",
    "python-dotenv",
    "uvicorn[standard]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtual_staff_engineer = ["database/sql/*.sql"]
